<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Aula14/assets/CSS/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Login</title>
</head>

<body>

    <header>
        <h1>LOGO</h1>

        <div class="header-components">
            <nav>
                <a href="#">Início</a>
                <a href="#">Serviços</a>
                <a href="#">sobre</a>
            </nav>
        </div>

        <div class="header-components">
            <button class="btn-header">
                Entrar ou Cadastrar
            </button>
        </div>

        <div class="hidden">
            <i id="btn-menu" class="fa-solid fa-bars"></i>
        </div>
    </header>

    <main>

        <div class="card-hello">
                <h1>Bem-vindo de volta!</h1>
                <p>Realce sua beleza com nossos serviços exclusivos.
                    Faça login e agende seu próximo atendimento.</p>


        </div>

        <div class="container-login">

            <div class="text-login">
                <i class="fa-solid fa-user"></i>
                <h2>Login</h2>
            </div>

            <form action="#" method="post">

                <div><label for="email">E-mail</label></div>
                <input type="email" id="email" placeholder="Exemplo@gmail.com" required>

                <div><label for="senha">Senha</label></div>
                <input type="password" id="senha" placeholder="Senha" required>

                <button class="btn-login" id="btn-login" type="submit">Entrar</button>

                <div class="form-link">
                    <p>Não tem um login?</p>
                    <a class="link-cadastro" href="#">Cadastre</a>
                </div>
            </form>

        </div>

    </main>

    <footer>

    </footer>

</body>

</html>
