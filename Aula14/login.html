<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Aula14/assets/CSS/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Login</title>
</head>

<body>
    <header>
        <h1>LOGO</h1>
        <nav>
            <a href="">Sobre</a>
            <a href="">Serviços</a>
            <a href="">Inicio</a>
        </nav>
        <button class="btn-header">Entrar ou <br>Cadastrar</button>
    </header>
    <main>
        <div class="card-hello">
            <h1>Bem-vindo de volta!</h1>
            <p>Realce sua beleza com nossos serviços exclusivos.
                Faça login e agende seu próximo atendimento.</p>
        </div>
        <div class="container-login">
            <div style="width: 100%;" class="text-login"> <i class="fa-solid fa-user"></i>
                <h2>Login</h2>
            </div>
            <form>
                <input type="email" placeholder="E-mail" required>

                <input type="password" placeholder="Senha" required>

                <button class="btn-login" id="btn-login" type="submit">Entrar</button>
                <a style="font-size: smaller;  color: #333d;" href="">Cadastrar</a>
            </form>
        </div>
    </main>
    <footer>

    </footer>
</body>

</html>
