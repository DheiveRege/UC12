<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 02</title>
</head>

<body>
    <h1>FORMS</h1>
    <form action="">
        <label for="user-name">Nome</label>
        <input name="user-name" type="text" placeholder="Insira Seu Nome">

        <label for="email">Email</label>
        <input type="email" name="email" id="" placeholder="Insira seu Email">

        <label for="passWord"> Passowrd</label>
        <input type="password" name="Passowrd" id="" placeholder=" Insira sua Senha">

        <label for="gender">Genero</label>
        <input type="checkbox" name="css" id="" value="css">css
        <input type="checkbox" name="html" id="" value="html">html
        <input type="checkbox" name="javascript" id="" value="javascript">javascript

        <input type="radio" name="gender" id="" value="man">Man
        <input type="radio" name="gender" id="" value="woman">Woman
        <input type="radio" name="gender" id="" value="javascript">javascript

        <label for="cursor">Curso</label>
        <select name="cursor" id="">
            <option value="gremio">gremio</option>
            <option value="juventude">juventude</option>
            <option value="filho-do-gremio">Internacional</option>
        </select>
        <textarea name="comment" id="" cols="30" rows="10" placeholder="Insert y ou comment"></textarea>
        <button type="submit">Enviar</button>
    </form>
</body>

</html>
